name: Weekly release

# Every Sunday at 19:00 (Amsterdam, winter time) a release is made from the
# [Unreleased] section of CHANGELOG.md — only when it contains entries.
# Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 tests/test_calc.py

      - name: Prepare release
        id: prep
        run: python3 .github/scripts/release.py

      - name: Commit, tag and publish
        if: steps.prep.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md custom_components/ennie_laadkosten/manifest.json
          git commit -m "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release_notes.md
