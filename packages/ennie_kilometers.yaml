# ============================================================
# ENNIE - KILOMETERS LEASEJAAR V1.5
# Houdt per kalenderjaar de gereden kilometers bij, verdeeld in
# zakelijk (kantoordagen x retourafstand + extra zakelijke km) en
# privé (totaal - zakelijk), en vergelijkt ze met de leaselimieten.
#
# Leasejaar = kalenderjaar. Begint het contract midden in een jaar,
# dan tellen de limieten naar rato: limiet / 365 x aantal dagen
# vanaf de contractdatum t/m 31 december.
#
# Kantoordag: de eerste keer per dag dat de auto de kantoorzone
# binnenrijdt. Kies de kantoorzone op het dashboard (tegel 'Kantoor
# locatie'); de keuzelijst wordt automatisch gevuld met alle zones.
#
# Meerkilometers: alleen privé-km boven het (naar rato) toegestane
# aantal worden verrekend tegen het tarief per km; zakelijke km niet.
# Bijbetalen = (privé gereden - privé toegestaan) x tarief, nu en op
# basis van de prognose voor 31 december.
#
# V1.4 Ritregister: elke kantoordag en elke handmatig toegevoegde
# zakelijke rit komt als regel in de takenlijst todo.ennie_zakelijke_ritten
# (integratie 'Lokale takenlijst', naam 'Ennie zakelijke ritten'), met
# datum, km en opmerking. Bestaat de lijst niet, dan werkt de telling gewoon.
# V1.5 Een handmatige rit (km, datum en opmerking in één keer) gaat via
# script.ennie_zakelijke_rit_registreren; het dashboard opent daarvoor een
# invulvenster (www/ennie-pdf-button.js, window.ennieRitPopup).
# ============================================================

input_number:
  ennie_km_limiet_prive:
    name: Ennie km-limiet privé per jaar
    min: 0
    max: 100000
    step: 500
    mode: box
    unit_of_measurement: km
    icon: mdi:car-side

  ennie_km_limiet_zakelijk:
    name: Ennie km-limiet zakelijk per jaar
    min: 0
    max: 100000
    step: 500
    mode: box
    unit_of_measurement: km
    icon: mdi:briefcase-variant

  ennie_km_kantoor_retour:
    name: Ennie km kantoor retour
    min: 0
    max: 1000
    step: 1
    mode: box
    unit_of_measurement: km
    icon: mdi:office-building-marker

  # Invoerveld per rit: vul de km van één zakelijke rit in (niet naar
  # kantoor). De automatisering telt dit op bij het jaartotaal
  # hieronder en zet het veld weer op 0.
  ennie_km_zakelijk_toevoegen:
    name: Ennie zakelijke rit toevoegen
    min: 0
    max: 5000
    step: 1
    mode: box
    unit_of_measurement: km
    icon: mdi:plus-circle-outline

  # Jaartotaal extra zakelijke km (gevuld via 'zakelijke rit toevoegen';
  # alleen zelf aanpassen om te corrigeren).
  ennie_km_extra_zakelijk:
    name: Ennie extra zakelijke km dit jaar
    min: 0
    max: 100000
    step: 1
    mode: box
    unit_of_measurement: km
    icon: mdi:briefcase-plus

  ennie_km_tarief_meerkm:
    name: Ennie tarief meerkilometers
    min: 0
    max: 2
    step: 0.01
    mode: box
    unit_of_measurement: €/km
    icon: mdi:cash-plus

  # Automatisch: kilometerstand op 1 januari. Voor het eerste jaar 0.
  ennie_km_stand_jaarstart:
    name: Ennie kilometerstand begin jaar
    min: 0
    max: 2000000
    step: 1
    mode: box
    unit_of_measurement: km
    icon: mdi:counter

input_select:
  # Keuzelijst met alle zones; wordt bij start en elk uur bijgewerkt.
  ennie_kantoor_zone:
    name: Ennie kantoor locatie
    options:
      - Geen
    icon: mdi:map-marker-radius

input_text:
  # Bewaart de gekozen kantoorzone over herstarts heen (automatisch).
  ennie_kantoor_zone_keuze:
    name: Ennie kantoor locatie (opgeslagen)
    max: 100

input_datetime:
  ennie_lease_start:
    name: Ennie startdatum leasecontract
    has_date: true
    has_time: false
    icon: mdi:calendar-start

  # Automatisch: datum van de laatst getelde kantoordag.
  ennie_laatste_kantoordag:
    name: Ennie laatste kantoordag
    has_date: true
    has_time: false
    icon: mdi:calendar-check

counter:
  ennie_kantoordagen:
    name: Ennie kantoordagen dit jaar
    icon: mdi:office-building
    minimum: 0
    step: 1

template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
      - trigger: state
        entity_id:
          - sensor.skoda_enyaq_kilometerstand
          - counter.ennie_kantoordagen
          - input_number.ennie_km_limiet_prive
          - input_number.ennie_km_limiet_zakelijk
          - input_number.ennie_km_kantoor_retour
          - input_number.ennie_km_extra_zakelijk
          - input_number.ennie_km_stand_jaarstart
          - input_number.ennie_km_tarief_meerkm
          - input_datetime.ennie_lease_start
    variables:
      stand: "{{ states('sensor.skoda_enyaq_kilometerstand') | float(0) }}"
      jaarstart: "{{ states('input_number.ennie_km_stand_jaarstart') | float(0) }}"
      km_jaar: "{{ [stand - jaarstart, 0] | max }}"
      zakelijk: >
        {{ (states('counter.ennie_kantoordagen') | int(0)
            * states('input_number.ennie_km_kantoor_retour') | float(0)
            + states('input_number.ennie_km_extra_zakelijk') | float(0)) | round(0) }}
      prive: "{{ [km_jaar - zakelijk, 0] | max }}"
      # Begin van de periode: 1 januari, of de contractdatum als die later is.
      startdatum: >
        {% set jan1 = now().strftime('%Y') ~ '-01-01' %}
        {% set lease = states('input_datetime.ennie_lease_start')[:10] %}
        {{ [jan1, lease] | max if lease is match('\d{4}-\d{2}-\d{2}$') else jan1 }}
      dagen_periode: >
        {% set start = as_datetime(startdatum).date() %}
        {% set eind = now().replace(month=12, day=31).date() %}
        {{ [(eind - start).days + 1, 1] | max }}
      dagen_verstreken: >
        {% set start = as_datetime(startdatum).replace(tzinfo=now().tzinfo) %}
        {{ [[(now() - start).total_seconds() / 86400, 1] | max, dagen_periode] | min }}
      factor: "{{ dagen_periode / 365 }}"
      toegestaan_prive: "{{ (states('input_number.ennie_km_limiet_prive') | float(0) * factor) | round(0) }}"
      toegestaan_zakelijk: "{{ (states('input_number.ennie_km_limiet_zakelijk') | float(0) * factor) | round(0) }}"
      voortgang: "{{ dagen_verstreken / dagen_periode }}"
      resterende_weken: "{{ [(dagen_periode - dagen_verstreken) / 7, 1 / 7] | max }}"
      tarief: "{{ states('input_number.ennie_km_tarief_meerkm') | float(0) }}"
      prog_prive: "{{ (prive / dagen_verstreken * dagen_periode) | round(0) }}"
      prog_zakelijk: "{{ (zakelijk / dagen_verstreken * dagen_periode) | round(0) }}"
      meer_prive_nu: "{{ [prive - toegestaan_prive, 0] | max | round(0) }}"
      meer_prive_prog: "{{ [prog_prive - toegestaan_prive, 0] | max | round(0) }}"
    sensor:
      - name: Ennie km dit jaar
        unique_id: ennie_km_dit_jaar
        icon: mdi:counter
        unit_of_measurement: km
        state_class: measurement
        availability: "{{ is_number(states('sensor.skoda_enyaq_kilometerstand')) }}"
        state: "{{ km_jaar | round(0) }}"
        attributes:
          startdatum: "{{ startdatum }}"
          dagen_periode: "{{ dagen_periode }}"
          dagen_verstreken: "{{ dagen_verstreken | round(1) }}"
          prognose: "{{ (km_jaar / dagen_verstreken * dagen_periode) | round(0) }}"
          prognose_per_jaar: "{{ (km_jaar / dagen_verstreken * 365) | round(0) }}"

      - name: Ennie km privé
        unique_id: ennie_km_prive
        icon: mdi:car-side
        unit_of_measurement: km
        state_class: measurement
        availability: "{{ is_number(states('sensor.skoda_enyaq_kilometerstand')) }}"
        state: "{{ prive | round(0) }}"
        attributes:
          toegestaan: "{{ toegestaan_prive }}"
          op_schema: "{{ (toegestaan_prive * voortgang) | round(0) }}"
          prognose: "{{ prog_prive }}"
          ruimte_per_week: "{{ ((toegestaan_prive - prive) / resterende_weken) | round(0) }}"
          meerkm_nu: "{{ meer_prive_nu }}"
          meerkm_prognose: "{{ meer_prive_prog }}"
          bijbetalen_nu: "{{ (meer_prive_nu * tarief) | round(2) }}"
          bijbetalen_prognose: "{{ (meer_prive_prog * tarief) | round(2) }}"

      - name: Ennie km zakelijk
        unique_id: ennie_km_zakelijk
        icon: mdi:briefcase-variant
        unit_of_measurement: km
        state_class: measurement
        state: "{{ zakelijk }}"
        attributes:
          kantoordagen: "{{ states('counter.ennie_kantoordagen') | int(0) }}"
          toegestaan: "{{ toegestaan_zakelijk }}"
          op_schema: "{{ (toegestaan_zakelijk * voortgang) | round(0) }}"
          prognose: "{{ prog_zakelijk }}"
          ruimte_per_week: "{{ ((toegestaan_zakelijk - zakelijk) / resterende_weken) | round(0) }}"

      - name: Ennie km bijbetalen
        unique_id: ennie_km_bijbetalen
        icon: mdi:cash-plus
        unit_of_measurement: EUR
        availability: "{{ is_number(states('sensor.skoda_enyaq_kilometerstand')) }}"
        state: "{{ (meer_prive_nu * tarief) | round(2) }}"
        attributes:
          tarief: "{{ tarief }}"
          meerkm_nu: "{{ meer_prive_nu }}"
          meerkm_prognose: "{{ meer_prive_prog }}"
          prognose: "{{ (meer_prive_prog * tarief) | round(2) }}"

script:
  # V1.5: één zakelijke rit registreren: telt de km op bij het jaartotaal
  # (alleen als de datum in het huidige jaar valt) en zet de rit in het
  # ritregister. Wordt gebruikt door het invulvenster op het dashboard en
  # door het invoerveld 'Ennie zakelijke rit toevoegen'.
  ennie_zakelijke_rit_registreren:
    alias: Ennie - Zakelijke rit registreren
    icon: mdi:briefcase-plus-outline
    mode: queued
    fields:
      km:
        name: Kilometers
        required: true
        selector:
          number:
            min: 1
            max: 5000
            unit_of_measurement: km
      datum:
        name: Datum
        description: Standaard vandaag
        selector:
          date:
      opmerking:
        name: Opmerking
        description: Standaard "Zakelijke rit"
        selector:
          text:
    sequence:
      - variables:
          rit: "{{ km | float(0) | round(0) }}"
          dag: >
            {% set d = datum | default('', true) | string %}
            {{ d[:10] if d[:10] is match('\\d{4}-\\d{2}-\\d{2}$') else now().strftime('%Y-%m-%d') }}
          tekst: >
            {% set o = opmerking | default('', true) | string | trim %}
            {{ o if o else 'Zakelijke rit' }}
      - condition: template
        value_template: "{{ rit > 0 }}"
      - if:
          - condition: template
            value_template: "{{ dag[:4] == now().strftime('%Y') }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ennie_km_extra_zakelijk
            data:
              value: "{{ [states('input_number.ennie_km_extra_zakelijk') | float(0) + rit, 100000] | min }}"
      - action: todo.add_item
        continue_on_error: true
        target:
          entity_id: todo.ennie_zakelijke_ritten
        data:
          item: "{{ rit | int }} km · {{ tekst }}"
          due_date: "{{ dag }}"
          description: "Handmatig toegevoegd op {{ now().strftime('%d-%m-%Y %H:%M') }}"

automation:
  - id: ennie_zakelijke_rit_toevoegen
    alias: Ennie - Zakelijke rit toevoegen
    description: >-
      Registreert de in het invoerveld ingevulde km als zakelijke rit (via
      script.ennie_zakelijke_rit_registreren) en zet het veld terug op 0.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_number.ennie_km_zakelijk_toevoegen
        not_to:
          - unknown
          - unavailable
    conditions:
      - condition: numeric_state
        entity_id: input_number.ennie_km_zakelijk_toevoegen
        above: 0
    actions:
      # Eerst het veld terugzetten, dan registreren via het script
      - variables:
          rit: "{{ trigger.to_state.state | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.ennie_km_zakelijk_toevoegen
        data:
          value: 0
      - action: script.ennie_zakelijke_rit_registreren
        data:
          km: "{{ rit }}"

  # V1.5: het ritregister is een logboek, geen takenlijst. Een per ongeluk
  # afgevinkte rit wordt meteen weer teruggezet, zodat hij zichtbaar blijft.
  - id: ennie_ritregister_vinkje_terugzetten
    alias: Ennie - Ritregister afgevinkte rit terugzetten
    description: Zet afgevinkte ritten in het ritregister direct terug naar open.
    mode: queued
    triggers:
      - trigger: state
        entity_id: todo.ennie_zakelijke_ritten
        not_to:
          - unknown
          - unavailable
    actions:
      - action: todo.get_items
        target:
          entity_id: todo.ennie_zakelijke_ritten
        data:
          status: completed
        response_variable: lijst
      - repeat:
          for_each: "{{ lijst['todo.ennie_zakelijke_ritten']['items'] | map(attribute='uid') | list }}"
          sequence:
            - action: todo.update_item
              target:
                entity_id: todo.ennie_zakelijke_ritten
              data:
                item: "{{ repeat.item }}"
                status: needs_action

  - id: ennie_kantoorzones_bijwerken
    alias: Ennie - Kantoorzones bijwerken
    description: >-
      Vult de keuzelijst 'Ennie kantoor locatie' met alle zones en zet de
      eerder gekozen zone terug.
    mode: queued
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: 7
    actions:
      - variables:
          bewaard: "{{ states('input_text.ennie_kantoor_zone_keuze') }}"
          zones: "{{ states.zone | map(attribute='name') | unique | sort | list }}"
      - action: input_select.set_options
        target:
          entity_id: input_select.ennie_kantoor_zone
        data:
          options: "{{ ['Geen'] + zones }}"
      - if:
          - condition: template
            value_template: "{{ bewaard in zones }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.ennie_kantoor_zone
            data:
              option: "{{ bewaard }}"

  - id: ennie_kantoorzone_opslaan
    alias: Ennie - Kantoorzone opslaan
    description: Bewaart de gekozen kantoorzone zodat die een herstart overleeft.
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_select.ennie_kantoor_zone
    conditions:
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable'] }}
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.ennie_kantoor_zone_keuze
        data:
          value: "{{ trigger.to_state.state }}"

  - id: ennie_kantoordag_tellen
    alias: Ennie - Kantoordag tellen
    description: Telt één kantoordag per dag zodra Ennie de kantoorzone binnenrijdt.
    mode: queued
    triggers:
      - trigger: state
        entity_id: device_tracker.skoda_enyaq_skoda_enyaq
    conditions:
      - condition: template
        value_template: >
          {{ trigger.to_state is not none
             and states('input_select.ennie_kantoor_zone') not in ['Geen', 'unknown', 'unavailable', '']
             and trigger.to_state.state == states('input_select.ennie_kantoor_zone')
             and (trigger.from_state is none or trigger.from_state.state != trigger.to_state.state) }}
      - condition: template
        value_template: >
          {{ states('input_datetime.ennie_laatste_kantoordag')[:10] != now().strftime('%Y-%m-%d') }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ennie_laatste_kantoordag
        data:
          date: "{{ now().strftime('%Y-%m-%d') }}"
      - action: counter.increment
        target:
          entity_id: counter.ennie_kantoordagen
      # V1.4: in het ritregister zetten
      - action: todo.add_item
        continue_on_error: true
        target:
          entity_id: todo.ennie_zakelijke_ritten
        data:
          item: >-
            {{ states('input_number.ennie_km_kantoor_retour') | float(0) | round(0) | int }} km · Automatisch woon- werkverkeer
          due_date: "{{ now().strftime('%Y-%m-%d') }}"
          description: "Kantoordag: aangekomen bij {{ states('input_select.ennie_kantoor_zone') }} om {{ now().strftime('%H:%M') }}"

  - id: ennie_km_nieuw_jaar
    alias: Ennie - Kilometers nieuw leasejaar
    description: >-
      Legt op 1 januari de kilometerstand vast als beginstand van het nieuwe
      jaar en zet de kantoordagen en extra zakelijke km op nul.
    mode: single
    triggers:
      - trigger: time
        at: "00:05:00"
    conditions:
      - condition: template
        value_template: "{{ now().month == 1 and now().day == 1 }}"
    actions:
      - if:
          - condition: template
            value_template: "{{ is_number(states('sensor.skoda_enyaq_kilometerstand')) }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.ennie_km_stand_jaarstart
            data:
              value: "{{ states('sensor.skoda_enyaq_kilometerstand') | float }}"
        else:
          - action: persistent_notification.create
            data:
              title: "Ennie: kilometerstand nieuw jaar"
              message: >-
                De kilometerstand was op 1 januari niet beschikbaar. Vul
                'Ennie kilometerstand begin jaar' zelf in.
      - action: counter.reset
        target:
          entity_id: counter.ennie_kantoordagen
      - action: input_number.set_value
        target:
          entity_id: input_number.ennie_km_extra_zakelijk
        data:
          value: 0
