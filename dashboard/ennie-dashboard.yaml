                    action: javascript
                    javascript: |-
                      [[[
                      const now = new Date();
                      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
                      let from, to;
                      switch ('this_week') {
                        case 'this_week':
                          from = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate());
                          to = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
                          break;
                        case 'last_week':
                          from = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() - 7);
                          to = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() - 1);
                          break;
                        case 'this_month':
                          from = new Date(now.getFullYear(), now.getMonth(), 1);
                          to = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                          break;
                        case 'last_month':
                          from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                          to = new Date(now.getFullYear(), now.getMonth(), 0);
                          break;
                        case 'this_year':
                          from = new Date(now.getFullYear(), 0, 1);
                          to = new Date(now.getFullYear(), 11, 31);
                          break;
                        case 'last_year':
                          from = new Date(now.getFullYear() - 1, 0, 1);
                          to = new Date(now.getFullYear() - 1, 11, 31);
                          break;
                      }
                      const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                      (async () => {
                        try {
                          await hass.callService('input_datetime','set_datetime',{entity_id:'input_datetime.ennie_kosten_van',date:fmt(from)});
                          await hass.callService('input_datetime','set_datetime',{entity_id:'input_datetime.ennie_kosten_tot',date:fmt(to)});
