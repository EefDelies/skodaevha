                          @media (max-width: 700px) {
                            ha-card { height: 54px !important; min-height: 54px !important; max-height: 54px !important; }
                            #container { height: 54px !important; min-height: 54px !important; max-height: 54px !important; grid-template-rows: 54px !important; }
                            #custom_fields { height: 54px !important; min-height: 54px !important; max-height: 54px !important; }
                          }
                  - type: conditional
                    conditions:
                    - condition: state
                      entity: input_boolean.ennie_automatisch_laden
                      state: 'off'
                    grid_options:
                      columns: 12
                    card:
                      type: vertical-stack
                      cards:
                      - type: custom:button-card
                        entity: input_boolean.ennie_automatisch_laden
                        show_icon: false
                        show_name: false
                        name: Automatisch laden
                        show_label: false
                        show_state: false
                        tap_action:
                          action: perform-action
                          perform_action: input_boolean.turn_on
                          target:
                            entity_id: input_boolean.ennie_automatisch_laden
                        hold_action:
