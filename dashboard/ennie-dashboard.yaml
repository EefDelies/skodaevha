          - type: markdown
            content: |-
              {% set s = states('sensor.ennie_laadkosten_periode') %}
              {% set a = state_attr('sensor.ennie_laadkosten_periode', 'dagtotalen') or [] %}
              {% set p = state_attr('sensor.ennie_laadkosten_periode', 'periode') or '' %}
              {% set chosen = states('input_datetime.ennie_kosten_van') ~ ' t/m ' ~ states('input_datetime.ennie_kosten_tot') %}
              {% set ready = p == chosen and s not in ['unknown', 'unavailable'] %}
              {% set kwh = a | sum(attribute='kwh') %}
              {% set cost = s | float(0) %}
              {% set employer = a | sum(attribute='vergoeding') %}
              {% set missing = state_attr('sensor.ennie_laadkosten_periode', 'kwh_zonder_prijs') | float(0) %}
              {% set priced = kwh - missing %}
              <div class="ennie-table-title" style="display:flex;align-items:center;justify-content:flex-start;gap:10px;color:#fff;font-size:19px;font-weight:700;margin-bottom:28px"><ha-icon icon="mdi:table-large"; margin-bottom:28px></ha-icon> Kosten per dag</div>

              {% if not ready %}
              *Gegevens worden bijgewerkt…*
              {% elif a | length == 0 %}
              Geen laadgegevens in deze periode.
              {% else %}
              {% set ns = namespace(rows=[
              '| Datum | Geladen | Kosten | Vergoeding | Verschil |',
              '|:---|---:|---:|---:|---:|'
              ]) %}
              {%- for r in a -%}
              {%- set date = r.datum[8:10] ~ '-' ~ r.datum[5:7] ~ '-' ~ r.datum[0:4] -%}
              {%- set quantity = ('%.3f' | format(r.kwh | float(0))) | replace('.', ',') -%}
              {%- set expense = ('%.2f' | format(r.kosten | float(0))) | replace('.', ',') -%}
              {%- set paid = ('%.2f' | format(r.vergoeding | float(0))) | replace('.', ',') -%}
              {%- set difference = ('%.2f' | format((r.vergoeding | float(0)) - (r.kosten | float(0)))) | replace('.', ',') -%}
              {%- set diff_cell = '<font color="#ff6b75"><em>€ ' ~ difference ~ '</span>' if ((r.vergoeding | float(0)) - (r.kosten | float(0))) < 0 else '€ ' ~ difference -%}
              {%- set ns.rows = ns.rows + ['| ' ~ date ~ ' | ' ~ quantity ~ ' kWh | € ' ~ expense ~ ' | € ' ~ paid ~ ' | ' ~ diff_cell ~ ' |'] -%}
              {%- endfor -%}
              {%- set quantity_total = ('%.3f' | format(kwh)) | replace('.', ',') -%}
              {%- set expense_total = ('%.2f' | format(a | sum(attribute='kosten'))) | replace('.', ',') -%}
              {%- set paid_total = ('%.2f' | format(employer)) | replace('.', ',') -%}
              {%- set diff_total = ('%.2f' | format(employer - (a | sum(attribute='kosten')))) | replace('.', ',') -%}
              {%- set diff_total_cell = '<font color="#ff6b75"><em>€ ' ~ diff_total ~ '</span>' if (employer - (a | sum(attribute='kosten'))) < 0 else '€ ' ~ diff_total -%}
              {%- set ns.rows = ns.rows + ['| **Totaal getoonde dagen** | **' ~ quantity_total ~ ' kWh** | **€ ' ~ expense_total ~ '** | **€ ' ~ paid_total ~ '** | **' ~ diff_total_cell ~ '** |'] -%}
              {{ '\n' ~ (ns.rows | join('\n')) }}
              {% endif %}
              {% if state_attr('sensor.ennie_laadkosten_periode', 'dagtotalen_afgekapt') %}
              *Alleen de laatste 120 dagen met laadactiviteit worden getoond.*
              {% endif %}
            card_mod:
              style:
                .: |
                  ha-card {
                    background: linear-gradient(145deg, #09271f 0%, #061b16 100%) !important;
                    border: 1px solid #175a47 !important;
                    border-radius: 17px !important;
                    box-shadow: none !important;
                    color: #eafff2 !important;
                    overflow: hidden !important;
                  }
                  ha-card .card-content { padding: 18px 18px !important; text-align: left !important; overflow-x: auto !important; }
                ha-markdown$: |
                  .markdown { text-align: left !important; width: 100% !important; }
                  .ennie-table-title { display: flex !important; align-items: center !important; justify-content: flex-start !important; gap: 10px !important; font-size: 19px !important; font-weight: 700 !important; margin-bottom: 12px !important; color: #fff !important; }
                  .ennie-table-title ha-icon { color: #40e697 !important; --mdc-icon-size: 23px; }
                  table { width: 100% !important; min-width: 650px !important; margin: 0 !important; border-collapse: collapse !important; font-size: 13px !important; color: #f1fff8 !important; }
                  thead, thead tr, th { background: #103d30 !important; }
                  th { color: #c4ffe0 !important; font-weight: 700 !important; padding: 13px 12px !important; border: 0 !important; }
                  td { padding: 12px !important; border: 0 !important; border-bottom: 1px solid #215345 !important; }
                  tbody tr:nth-child(odd) { background: #071e18 !important; }
                  tbody tr:nth-child(even) { background: #0d3026 !important; }
                  tbody tr:hover { background: #174b3b !important; }
                  th:first-child, td:first-child { text-align: left !important; }
                  th:not(:first-child), td:not(:first-child) { text-align: right !important; }
                  tbody tr:last-child { font-weight: 700 !important; background: #123d30 !important; }

                  .ennie-negative, td .ennie-negative { color: #ff6b75 !important; font-weight: 700 !important; }

                  /* Negatieve bedragen in de kolom Verschil */
                  table tbody td:last-child:has(em), table tbody td:last-child em, table tbody td:last-child font[color="#ff6b75"] { color:#ff6b75 !important; font-style:normal !important; font-weight:700 !important; }
