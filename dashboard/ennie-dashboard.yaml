# Ennie dashboard (Lovelace, storage mode)
# Import: create a new dashboard, open it, ⋮ > Edit dashboard > ⋮ > Raw configuration editor,
# replace everything with this file and save.
# Requires: button-card, card-mod, expander-card, apexcharts-card, datetime-picker-card
# and www/ennie-pdf-button.js (see README).
views:
- title: Ennie
  path: ennie
  icon: mdi:car-electric
  type: panel
  cards:
  - type: custom:mod-card
    card_mod:
      style: |2

            ha-card {
              width: 80%;
              max-width: 1600px;
              margin: 0 auto;
              padding: 0;
              background: transparent;
              border: none;
              box-shadow: none;
              box-sizing: border-box;
            }
            @media (max-width: 900px) {
              ha-card { width: 100%; }
            }

        @media (max-width: 1500px) {
          ha-card { width: 96% !important; max-width: none !important; }
        }
        @media (max-width: 700px) {
          ha-card { width: 100% !important; }
        }

        @media (max-width: 600px) { ha-card { width: 100% !important; max-width: 100% !important; overflow-x: hidden; } }
    card:
      type: vertical-stack
      cards:
      - type: custom:button-card
        entity: sensor.skoda_enyaq_accupercentage
        show_icon: false
        show_name: false
        show_state: false
        custom_fields:
          content: |-
            [[[
             const s=(id)=>states[id]?.state ?? 'unknown';
             const battery=Number(s('sensor.skoda_enyaq_accupercentage'));
             const pct=Number.isFinite(battery)?Math.max(0,Math.min(100,battery)):null;
             const range=s('sensor.skoda_enyaq_actieradius');
             const connected=s('binary_sensor.skoda_enyaq_verbonden')==='on';
             const cable=s('binary_sensor.skoda_enyaq_laadkabel')==='on';
             const status=s('sensor.skoda_enyaq_laadstatus');
             const zaptecMode=s('sensor.oprit_zaptec_go2_opladermodus');
             const limit=Number(s('input_number.ennie_max_laadpercentage'));
             const validPct=pct!==null && s('sensor.skoda_enyaq_accupercentage')!=='unknown' && s('sensor.skoda_enyaq_accupercentage')!=='unavailable';
             const limitReached=validPct && Number.isFinite(limit) && limit>0 && pct>=limit;
             const charging=zaptecMode==='connected_charging';
             const locA=states['sensor.ennie_laadlocatie']?.attributes||{};
             const extern=!charging && s('sensor.ennie_laadlocatie')==='extern';
             const extKw=Number(locA.vermogen_kw);
             const extPlug=!charging && !extern && zaptecMode==='disconnected' && cable;
             const extPlugDetail=`${locA.plaats && locA.plaats!=='Thuis' ? locA.plaats+' · ' : ''}${validPct && pct>=100 ? 'Accu vol' : status==='conserving' ? 'Accu op peil' : status==='charging_interrupted' ? 'Laden onderbroken' : 'Niet aan het laden'}`;
             const chargeText=extern?`Laadt extern<span class="ennie-ext-sep"> · </span><span class="ennie-ext-detail">${locA.plaats||'Onderweg'}${Number.isFinite(extKw)&&extKw>0?' · '+extKw.toLocaleString('nl-NL',{maximumFractionDigits:1})+' kW':''}</span>`:extPlug?`Extern aangesloten<span class="ennie-ext-sep"> · </span><span class="ennie-ext-detail">${extPlugDetail}</span>`:charging?'Aan het laden':zaptecMode==='connected_finished'?(limitReached?'Laadlimiet bereikt':'Laden onderbroken'):zaptecMode==='connected_requesting'?'Wachten op laden':zaptecMode==='disconnected'?'Niet aangesloten':zaptecMode==='unknown'||zaptecMode==='unavailable'?'Laadstatus onbekend':status==='charging_interrupted'?'Laden onderbroken':'Niet aan het laden';
             const cableText=cable?'Laadkabel aangesloten':'Laadkabel losgekoppeld';
             const updatedRaw=s('sensor.skoda_enyaq_laatst_bijgewerkt');
             const updatedDate=new Date(updatedRaw);
             const updatedMs=updatedDate.getTime();
             const updatedAge=Number.isFinite(updatedMs)?Math.max(0,Math.floor((Date.now()-updatedMs)/60000)):null;
             const updatedText=updatedAge===null?'Onbekend':updatedAge<1?'Zojuist':updatedAge===1?'1 minuut geleden':updatedAge<60?`${updatedAge} minuten geleden`:updatedAge<120?'1 uur geleden':updatedAge<1440?`${Math.floor(updatedAge/60)} uur geleden`:updatedAge<2880?'1 dag geleden':`${Math.floor(updatedAge/1440)} dagen geleden`;
             const col = pct === null ? '#879a92' : pct < 10 ? '#f44336' : pct <= 20 ? '#ff9800' : '#43e38e';
             return `
             <style>
               @media (max-width: 1500px) {
                 .ennie-hero-right { width: 29% !important; right: 2% !important; }
                 .ennie-hero-left { width: 23% !important; }
                 .ennie-hero-title { transform: translateY(-43px) !important; }
               }
               @media (max-width: 800px) {
                 .ennie-hero-right { width: 37% !important; }
                 .ennie-hero-left { width: 29% !important; }
               }

               .ennie-mobile-name { display:none; }
               /* iPhone: afzonderlijke compositie, desktop en laptop ongewijzigd */
               @media (max-width: 600px) {
                 .ennie-mobile-name {display:block !important;position:absolute;top:17px;right:15px;z-index:4;color:#fff;font-size:22px;font-weight:750;text-shadow:0 2px 8px #001a15;}
                 .ennie-hero-left {left:14px !important;top:12px !important;bottom:auto !important;width:55% !important;height:102px !important;justify-content:flex-start !important;gap:0 !important;}
                 .ennie-hero-left img {width:66px !important;height:59px !important;object-fit:contain !important;}
                 .ennie-hero-title {display:none !important;}
                 .ennie-hero-title > div {font-size:22px !important;}
                 .ennie-hero-left > div:last-child {display:none !important;}
                 .ennie-hero-right {left:12px !important;right:12px !important;top:auto !important;bottom:12px !important;width:auto !important;height:148px !important;display:grid !important;grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;grid-template-rows:83px 55px !important;gap:10px !important;}
                 .ennie-hero-right > div:first-child {grid-column:1 / -1 !important;padding:8px 14px !important;}
                 .ennie-hero-right > div:nth-child(2) {grid-column:1 !important;padding:6px 8px !important;gap:5px !important;}
                 .ennie-hero-right > div:nth-child(3) {grid-column:2 !important;padding:6px 8px !important;gap:5px !important;}
                 .ennie-hero-right > div:nth-child(2) ha-icon {--mdc-icon-size:19px !important;}
                 .ennie-hero-right > div:nth-child(3) ha-icon {--mdc-icon-size:19px !important;}
                 .ennie-hero-right > div:nth-child(2) div div {font-size:11px !important;line-height:1.1 !important;}
                 .ennie-hero-right > div:nth-child(3) div div {font-size:10px !important;line-height:1.1 !important;}
                 .ennie-hero-right > div:nth-child(2) > ha-icon:last-child {display:none !important;}
                 .ennie-ext-sep {display:none !important;}
                 .ennie-ext-detail {display:block !important;font-size:10px !important;font-weight:500 !important;color:#c6dbd0 !important;white-space:nowrap !important;overflow:hidden !important;text-overflow:ellipsis !important;margin-top:2px !important;}
               }
               .ennie-ext-sep {display:none;}
               .ennie-ext-detail {display:block;font-size:12px;font-weight:500;color:#c6dbd0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
               @keyframes ennie-charge-breathe {
                 0%,100% {
                   background-color: rgba(0,21,17,.50);
                   box-shadow: inset 0 0 0 0 ${col}00;
                 }
                 50% {
                   background-color: ${col}75;
                   box-shadow: inset 0 0 34px 5px ${col}a8;
                 }
               }
               @keyframes ennie-charge-breathe-ext {
                 0%,100% {
                   background-color: rgba(0,21,17,.50);
                   box-shadow: inset 0 0 0 0 #559bd500;
                 }
                 50% {
                   background-color: #559bd575;
                   box-shadow: inset 0 0 34px 5px #559bd5a8;
                 }
               }
               @media (prefers-reduced-motion: reduce) {
                 .ennie-charge-active { animation: none !important; }
               }
             </style>
             <div style="position:relative;width:100%;height:100%;overflow:hidden;border-radius:19px;background:#03160f;color:#fff;text-align:left">
               <div style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;background-image:url(/local/ennie/ennie-hero.webp?v=2);background-size:cover;background-position:center"></div>\n
               <div class="ennie-hero-left" style="position:absolute;left:2.5%;top:10%;bottom:10%;width:20%;display:flex;flex-direction:column;justify-content:space-between;z-index:1">
                 <img src="/local/ennie/skoda-logo.webp?v=2" style="width:105px;height:96px;object-fit:contain;object-position:left center" />
                 <div class="ennie-hero-title" style="transform:translateY(-23px)"><div style="font-size:clamp(20px,2vw,30px);font-weight:750">Ennie</div></div>
                 <div style="font-size:clamp(11px,.85vw,14px);line-height:1.5;color:#d3e5db">Enyaq 85<br>Sportline Tour Edition<br>MY2026</div>
               </div>
               <div class="ennie-mobile-name">Ennie</div>
               <div class="ennie-hero-right" style="position:absolute;right:2.6%;top:8%;bottom:8%;width:21%;display:flex;flex-direction:column;gap:10px;z-index:2">
                 <div style="flex:1.25;min-height:0;border:1px solid #12533c;border-radius:14px;background:rgba(0,21,17,.50);display:grid;grid-template-columns:minmax(0,1.05fr) 1px minmax(0,1fr);align-items:center;padding:9px 8px;column-gap:6px;box-sizing:border-box;overflow:hidden">
                   <div style="min-width:0;display:flex;align-items:center;gap:5px">
                     <ha-icon icon="${pct === null ? 'mdi:battery-unknown' : pct <= 0 ? 'mdi:battery-outline' : pct >= 100 ? 'mdi:battery' : `mdi:battery-${Math.max(10, Math.min(90, Math.ceil(pct / 10) * 10))}`}" style="--mdc-icon-size:24px;color:${col};flex-shrink:0"></ha-icon>
                     <div style="min-width:0;flex:1"><div style="font-size:clamp(18px,1.45vw,23px);line-height:1.1;white-space:nowrap;font-weight:750">${pct===null?'—':pct+'%'}</div><div style="font-size:11px;color:#c6dbd0">Accu</div><div style="height:6px;border-radius:5px;background:#173c31;margin-top:8px"><div style="width:${pct??0}%;height:100%;background:${col};border-radius:5px"></div></div></div>
                   </div>
                   <div style="width:1px;height:65%;background:#44685c"></div>
                   <div onclick="event.stopPropagation(); this.dispatchEvent(new CustomEvent('hass-more-info', {detail:{entityId:'sensor.skoda_enyaq_actieradius'},bubbles:true,composed:true}));" style="min-width:0;display:flex;align-items:center;gap:3px;cursor:pointer">
                     <ha-icon icon="mdi:car" style="--mdc-icon-size:20px;color:#e9f7f1;flex-shrink:0"></ha-icon>
                     <div style="min-width:0;flex:1"><div style="font-size:clamp(13px,1.0vw,17px);font-weight:750;white-space:nowrap;letter-spacing:-.5px">${range==='unknown'||range==='unavailable'?'—':range+' km'}</div><div style="font-size:11px;color:#c6dbd0">Actieradius</div></div>
                   </div>
                 </div>
                 <div class="${charging||extern ? 'ennie-charge-active' : ''}" style="flex:.85;min-height:0;border:1px solid #12533c;border-radius:14px;background-color:rgba(0,21,17,.50);display:flex;align-items:center;gap:9px;padding:12px 11px;box-sizing:border-box;${charging ? 'animation:ennie-charge-breathe 2.7s ease-in-out infinite;' : extern ? 'animation:ennie-charge-breathe-ext 2.7s ease-in-out infinite;' : ''}">
                   <ha-icon icon="mdi:power-plug" style="--mdc-icon-size:28px;color:#e9f7f1"></ha-icon>
                   <div style="flex:1;min-width:0"><div style="font-size:clamp(12px,1.1vw,17px);font-weight:650">${chargeText}</div></div>
                 </div>
                 <div onclick="event.stopPropagation(); this.dispatchEvent(new CustomEvent('hass-more-info', {detail:{entityId:'sensor.skoda_enyaq_laatst_bijgewerkt'},bubbles:true,composed:true}));" style="flex:.78;min-height:0;border:1px solid #12533c;border-radius:14px;background:rgba(0,21,17,.50);display:flex;align-items:center;gap:9px;padding:7px 11px;box-sizing:border-box;cursor:pointer">
                   <ha-icon icon="mdi:refresh" style="--mdc-icon-size:25px;color:#48df96;flex-shrink:0"></ha-icon>
                   <div style="min-width:0;flex:1;text-align:left"><div style="font-size:clamp(10px,.95vw,14px);font-weight:650;line-height:1.15;white-space:normal">Gegevens bijgewerkt</div><div style="font-size:clamp(10px,.8vw,12px);color:#c6dbd0;line-height:1.2;margin-top:3px">${updatedText}</div></div>
                 </div>
               </div>
             </div>`;
            ]]]
        tap_action:
          action: more-info
        styles:
          card:
          - height: clamp(245px, 21vw, 350px)
          - padding: '0'
          - overflow: hidden
          - background: '#03120f'
          - border: '1px solid #174c3f'
          - border-radius: 20px
          grid:
          - grid-template-areas: '"content"'
          - grid-template-columns: 1fr
          - grid-template-rows: 1fr
          custom_fields:
            content:
            - width: 100%
            - height: 100%
            - overflow: hidden
        triggers_update:
        - sensor.skoda_enyaq_accupercentage
        - sensor.skoda_enyaq_actieradius
        - binary_sensor.skoda_enyaq_verbonden
        - binary_sensor.skoda_enyaq_laadkabel
        - sensor.skoda_enyaq_laadstatus
        - sensor.skoda_enyaq_laatst_bijgewerkt
        - sensor.oprit_zaptec_go2_opladermodus
        - input_number.ennie_max_laadpercentage
        - sensor.ennie_laadlocatie
        update_timer: 60000
        extra_styles: |2-

          @media (max-width:600px){ha-card{height:425px !important;min-height:425px !important;}}
      - type: custom:mod-card
        card_mod:
          style: |-
            @media (max-width: 600px) { ha-card { display: none !important; } }
            ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
        card:
          type: vertical-stack
          cards:
          - type: heading
            heading: Slim laden
            icon: mdi:lightning-bolt
            card_mod:
              style: |
                :host {
                  display: block;
                  background: linear-gradient(110deg, #103c2c 0%, #17513b 100%) !important;
                  border: 1px solid #276b4c !important;
                  border-radius: 12px !important;
                  padding: 8px 14px !important;
                  box-sizing: border-box !important;
                  margin-top: 4px !important;
                  margin-bottom: 8px !important;
                }
                :host, :host * {
                  --primary-text-color: #eafff2;
                }
                ha-card {
                  background: transparent !important;
                  box-shadow: none !important;
                }

                :host { --mdc-icon-size: 24px; --state-icon-color: #32b878 !important; --paper-item-icon-color: #32b878 !important; }
                ha-icon, ha-svg-icon, .icon { color: #32b878 !important; --mdc-icon-size: 24px; }
          - type: grid
            columns: 1
            square: false
            cards:
            - type: vertical-stack
              cards:
              - type: grid
                columns: 4
                square: false
                cards:
                - type: vertical-stack
                  cards:
                  - type: conditional
                    conditions:
                    - condition: state
                      entity: input_boolean.ennie_automatisch_laden
                      state: 'on'
                    grid_options:
                      columns: 12
                    card:
                      type: vertical-stack
                      cards:
                      - type: custom:button-card
                        entity: input_boolean.ennie_automatisch_laden
                        show_icon: false
                        show_name: false
                        name: Automatisch laden
                        show_label: false
                        show_state: false
                        tap_action:
                          action: perform-action
                          perform_action: input_boolean.turn_off
                          target:
                            entity_id: input_boolean.ennie_automatisch_laden
                        hold_action:
                          action: more-info
                        custom_fields:
                          content: <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0 14px;text-align:center;gap:8px;"><span style="display:flex;align-items:center;gap:8px;flex:0 1 auto;text-align:center;font-size:14px;font-weight:600;color:#eafff2;white-space:nowrap;"><ha-icon icon="mdi:cog" style="width:24px;height:24px;color:#50df90;flex-shrink:0;"></ha-icon><span>Automatisch laden</span></span><span style="width:42px;height:24px;flex:0 0 42px;border-radius:14px;background:#187a53;padding:3px;box-sizing:border-box;display:flex;justify-content:flex-end;align-items:center;"><span style="width:18px;height:18px;background:#5cf0a0;border-radius:50%;display:block;"></span></span></div>
                        styles:
                          card:
                          - 'height: 112px'
                          - 'padding: 0'
                          - 'background: linear-gradient(145deg,#071e19,#061310)'
                          - 'border: 1px solid #174c3f'
