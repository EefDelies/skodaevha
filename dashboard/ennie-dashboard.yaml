- title: Stroomprijs
  path: ennie-prijsgrafiek
  subview: true
  icon: mdi:chart-bar
  cards:
  - type: custom:apexcharts-card
    graph_span: 24h
    span:
      start: hour
    header:
      show: true
      title: All-in stroomprijs per uur (€/kWh)
      show_states: false
    now:
      show: true
      label: Nu
      color: '#00BFFF'
    apex_config:
      chart:
        height: 250px
        toolbar:
          show: false
      legend:
        show: false
      yaxis:
        title:
          text: ''
        labels:
          formatter: |
            EVAL:function(value) {
              return "€" + value.toFixed(2);
            }
      plotOptions:
        bar:
          columnWidth: 60%
          borderRadius: 0
      tooltip:
        'true':
          formatter: |
            EVAL:function(value) {
              return "€ " + value.toFixed(3) + "/kWh";
            }
    series:
    - entity: sensor.nord_pool_grafiekprijzen
      name: All-in stroomprijs
      type: column
      float_precision: 3
      stroke_width: 0
      color: '#00B050'
      data_generator: |
        const opslag = Number(
          hass.states['input_number.ennie_inkoopvergoeding']?.state
        );
        const belasting = Number(
          hass.states['input_number.ennie_energiebelasting']?.state
        );

        if (!Number.isFinite(opslag) ||
            !Number.isFinite(belasting)) {
          return [];
        }

        const uren = {};

        for (const record of (entity.attributes.prices || [])) {
          const tijd = new Date(record.time).getTime();
          const beursprijs = Number(record.price);

          if (!Number.isFinite(tijd) ||
              !Number.isFinite(beursprijs)) continue;

          const datum = new Date(tijd);
          datum.setMinutes(0, 0, 0);
          const uur = datum.getTime();

          if (!uren[uur]) uren[uur] = [];

          uren[uur].push(
            (beursprijs + opslag + belasting) * 1.21
          );
        }

        return Object.entries(uren)
          .map(([tijd, prijzen]) => [
            Number(tijd),
            prijzen.reduce((a, b) => a + b, 0) / prijzen.length
          ])
          .sort((a, b) => a[0] - b[0]);
      color_threshold:
      - value: 0
        color: '#00B050'
      - value: 0.25
        color: '#FFC107'
      - value: 0.35
        color: '#F44336'
    experimental:
      color_threshold: true
