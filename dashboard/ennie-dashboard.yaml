                  content: |-
                    [[[
                      const get = id => states[id];
                      const esc = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
                      const green = '#50df90', red = '#ff6868', muted = '#9bb1aa';
                      const status = get('binary_sensor.oprit_zaptec_go2_online')?.state;
                      const online = status === 'on' ? {text:'Verbonden',color:green} : status === 'off' ? {text:'Offline',color:red} : {text:'Onbekend',color:muted};
                      const sensor = id => {
                        const e = get(id), v = e?.state;
                        if (!v || ['unknown','unavailable'].includes(v)) return {text:'Onbekend',color:muted};
                        const unit = e.attributes?.unit_of_measurement || '';
                        return {text: v + (unit ? ' ' + unit : ''),color:'#eafff2'};
                      };
                      const rawMode = get('sensor.oprit_zaptec_go2_opladermodus')?.state;
                      const modeKey = String(rawMode || 'unknown').toLowerCase().trim();
                      const modeMap = {
                        disconnected: ['Losgekoppeld',red],
                        connected: ['Aangesloten',green],
                        charging: ['Aan het laden',green],
                        completed: ['Laden voltooid',green],
                        waiting: ['Wachten op laden','#ffbf47'],
                        paused: ['Laden gepauzeerd','#ffbf47'],
                        unknown: ['Onbekend',muted],
                        unavailable: ['Niet beschikbaar',muted]
                      };
                      const mode = modeMap[modeKey] || [rawMode || 'Onbekend',muted];
                      const modeStatus = {text:mode[0],color:mode[1]};
                      const rows = [
                        ['mdi:lan-connect','Online',online],
                        ['mdi:ev-station','Laadmodus',modeStatus],
                        ['mdi:counter','Laatste sessie',sensor('sensor.oprit_zaptec_go2_laatste_laadsessie')],
                        ['mdi:lightning-bolt','Huidige sessie',sensor('sensor.oprit_zaptec_go2_totale_laadsessie')],
                        ['mdi:meter-electric','Meterstand',sensor('sensor.oprit_zaptec_go2_meterwaarde')],
                                                        ['mdi:current-ac','Stroom fase L1',sensor('sensor.oprit_zaptec_go2_stroom_fase1')],
                                                        ['mdi:current-ac','Stroom fase L2',sensor('sensor.oprit_zaptec_go2_stroom_fase2')],
                                                        ['mdi:current-ac','Stroom fase L3',sensor('sensor.oprit_zaptec_go2_stroom_fase3')]
                      ];
                      const body = rows.map(([icon,label,v]) => `<div style="display:grid;width:100%;grid-template-columns:20px minmax(0,1fr) max-content;align-items:center;gap:8px;min-height:37px;">
                        <ha-icon icon="${icon}" style="--mdc-icon-size:19px;color:${v.color === green || v.color === red ? v.color : '#4d85b3'}"></ha-icon>
                        <span style="font-size:13px;color:#eafff2;text-align:left;min-width:0;">${esc(label)}</span>
                        <span style="font-size:12px;color:${v.color};font-weight:600;text-align:right;white-space:nowrap;">${esc(v.text)}</span>
                      </div>`).join('');
                      return `<div style="display:flex;flex-direction:column;width:100%;min-width:0;box-sizing:border-box;text-align:left;margin:0;align-items:stretch;padding:0 16px;">
                        ${body}
                      </div>`;
                    ]]]
