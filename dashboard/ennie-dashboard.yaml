                - sensor.skoda_enyaq_software_versie
                - device_tracker.skoda_enyaq_skoda_enyaq
                custom_fields:
                  content: |-
                    [[[
                      const get = id => states[id]?.state ?? 'unavailable';
                      const good = '#50df90', bad = '#ff6868', neutral = '#9bb1aa';
                      const clean = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                      const binary = (id, onText, offText, onGood=false) => {
                        const s = get(id);
                        if (s !== 'on' && s !== 'off') return {text:'Onbekend',color:neutral};
                        const isOn = s === 'on';
                        return {text:isOn ? onText : offText,color:(isOn === onGood) ? good : bad};
                      };
                      const simple = (id, goodOn=true) => binary(id,'Ja','Nee',goodOn);
                      const rows = [
                        ['mdi:wifi','Verbonden',binary('binary_sensor.skoda_enyaq_verbonden','Verbonden','Niet verbonden',true)],
                        ['mdi:check-decagram','Gegevens actueel',simple('binary_sensor.ennie_skoda_gegevens_actueel')],
                        ['mdi:ev-plug-type2','Laadkabel',binary('binary_sensor.skoda_enyaq_laadkabel','Aangesloten','Losgekoppeld',true)],
                        ['mdi:lock','Kabelvergrendeling',binary('binary_sensor.skoda_enyaq_laadkabelvergrendeling','Vergrendeld','Ontgrendeld',true)]
                      ];
                      const odoIds = ['sensor.skoda_enyaq_kilometerstand','sensor.skoda_enyaq_tellerstand','sensor.skoda_enyaq_odometer','sensor.skoda_enyaq_mileage'];
                      const odoId = odoIds.find(id => states[id] && !['unknown','unavailable'].includes(get(id)));
                      const odoValue = odoId ? Number(get(odoId)) : NaN;
                      const odoText = Number.isFinite(odoValue) ? new Intl.NumberFormat('nl-NL',{maximumFractionDigits:0}).format(odoValue) + ' km' : 'Onbekend';
                      rows.splice(2,0,['mdi:counter','Kilometerstand',{text:odoText,color:Number.isFinite(odoValue)?good:neutral}]);
                      const numeric = (id, unit, decimals=0) => {
                        const value = Number(get(id));
                        const valid = !['unknown','unavailable','none',''].includes(String(get(id)).toLowerCase()) && Number.isFinite(value);
                        return {text:valid ? new Intl.NumberFormat('nl-NL',{minimumFractionDigits:decimals,maximumFractionDigits:decimals}).format(value)+' '+unit : 'Onbekend',color:valid?good:neutral};
                      };
                      const sw = get('sensor.skoda_enyaq_software_versie');
                      const swValid = !['unknown','unavailable','none',''].includes(String(sw).toLowerCase());
                      rows.splice(3,0,
                        ['mdi:thermometer','Buitentemperatuur',numeric('sensor.skoda_enyaq_buitentemperatuur','°C',1)],
                        ['mdi:wrench-clock','Volgend onderhoud',numeric('sensor.skoda_enyaq_volgend_onderhoud','dagen')],
                        ['mdi:cellphone-information','Softwareversie',{text:swValid?sw:'Onbekend',color:swValid?good:neutral}]
                      );
                      const loc = states['device_tracker.skoda_enyaq_skoda_enyaq'];
                      const locKnown = loc && !['unknown','unavailable'].includes(loc.state);
                      const locText = locKnown ? (loc.attributes?.friendly_name && loc.state === 'home' ? 'Thuis' : loc.state === 'home' ? 'Thuis' : loc.state === 'not_home' ? 'Onderweg' : loc.state) : 'Onbekend';
                      rows.push(['mdi:map-marker','Locatie Ennie',{text:locText,color:locKnown?good:neutral}]);
                      const rowsHtml = rows.map(([icon,label,s]) => `<div style="display:grid;width:100%;grid-template-columns:20px minmax(0,1fr) max-content;align-items:center;gap:8px;min-height:37px;">
                        <ha-icon icon="${icon}" style="--mdc-icon-size:19px;color:${s.color}"></ha-icon>
                        <span style="font-size:13px;color:#eafff2;text-align:left;min-width:0;">${clean(label)}</span>
                        <span style="font-size:12px;color:${s.color};font-weight:600;text-align:right;white-space:nowrap;">${clean(s.text)}</span>
                      </div>`).join('');
                      return `<div style="display:flex;flex-direction:column;width:100%;min-width:0;box-sizing:border-box;text-align:left;margin:0;align-items:stretch;padding:0 16px;">
                        ${rowsHtml}
                      </div>`;
                    ]]]
